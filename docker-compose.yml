version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: medassist-mysql
    restart: unless-stopped
    environment:
      MYSQL_USER: medassist
      MYSQL_PASSWORD: medassist_pass
      MYSQL_DATABASE: medassist_db
      MYSQL_ROOT_PASSWORD: medassist_root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u medassist -pmedassist_pass"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: medassist-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medassist-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      MYSQL_HOST: mysql
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medassist-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
