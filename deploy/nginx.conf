server {
    listen 80;
    server_name _; # Replace with domain or EC2 Public IP

    # Frontend proxy (Next.js server)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API proxy (Uvicorn / FastAPI server)
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / Redoc Documentation proxy
    location /api/docs {
        proxy_pass http://127.0.0.1:8000/api/docs;
        proxy_set_header Host $host;
    }
    
    location /api/openapi.json {
        proxy_pass http://127.0.0.1:8000/api/openapi.json;
        proxy_set_header Host $host;
    }

    # Disable access log for health check endpoints
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
